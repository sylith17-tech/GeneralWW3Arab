<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الموظفين - General WW3 Arab</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#0b1220;
      color:#fff;
    }
    header{
      padding:20px;
      background:#111c2e;
      border-bottom:1px solid #263752;
    }
    header h1{margin:0}
    .container{
      width:min(1100px,92%);
      margin:30px auto;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:18px;
    }
    .card{
      padding:24px;
      background:#111c2e;
      border:1px solid #263752;
      border-radius:14px;
    }
    .card h2{margin-top:0}
    .number{
      font-size:30px;
      font-weight:bold;
    }
    .action{
      display:block;
      margin-top:14px;
      padding:11px;
      text-align:center;
      border-radius:8px;
      background:#1769aa;
      color:white;
      text-decoration:none;
    }
    .back{
      display:inline-block;
      margin-top:30px;
      padding:12px 18px;
      border-radius:8px;
      background:#263752;
      color:white;
      text-decoration:none;
    }
  </style>
</head>

<body>

<header>
  <div class="container">
    <h1>لوحة الموظفين</h1>
    <p>General WW3 Arab</p>
  </div>
</header>

<main class="container">

  <div class="grid">

    <section class="card">
      <h2>المهام</h2>
      <div class="number">0</div>
      <p>المهام الحالية</p>
      <a class="action" href="#">عرض المهام</a>
    </section>

    <section class="card">
      <h2>الطلبات</h2>
      <div class="number">0</div>
      <p>الطلبات المعلقة</p>
      <a class="action" href="#">عرض الطلبات</a>
    </section>

    <section class="card">
      <h2>التقارير</h2>
      <div class="number">0</div>
      <p>التقارير المتاحة</p>
      <a class="action" href="#">عرض التقارير</a>
    </section>

    <section class="card">
      <h2>الحساب</h2>
      <p>إدارة معلومات الموظف</p>
      <a class="action" href="#">الملف الشخصي</a>
    </section>

  </div>

  <a class="back" href="/GeneralWW3Arab/">العودة للرئيسية</a>

</main>

</body>
</html>
