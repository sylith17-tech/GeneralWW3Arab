<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تواصل معنا - General WW3 Arab</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0b1220;color:#fff}
.container{width:min(700px,92%);margin:50px auto}
.box{background:#111c2e;border:1px solid #263752;border-radius:16px;padding:30px}
h1{margin-top:0}
label{display:block;margin:16px 0 7px}
input,textarea{
width:100%;padding:13px;border-radius:8px;
border:1px solid #334766;background:#0b1424;
color:#fff;font-size:15px;box-sizing:border-box
}
textarea{min-height:140px;resize:vertical}
button{
width:100%;margin-top:20px;padding:13px;
border:0;border-radius:8px;background:#1769aa;
color:#fff;font-size:16px;cursor:pointer
}
button:hover{background:#2082ce}
a{display:inline-block;margin-top:20px;color:#8fc7ff;text-decoration:none}
#message{display:none;margin-top:18px;padding:12px;background:#24334a;border-radius:8px}
</style>
</head>

<body>
<main class="container">
<div class="box">

<h1>تواصل معنا</h1>
<p>يمكنك إرسال رسالة من خلال النموذج التالي.</p>

<form id="contactForm">

<label for="name">الاسم</label>
<input id="name" type="text" required>

<label for="email">البريد الإلكتروني</label>
<input id="email" type="email" required>

<label for="messageText">الرسالة</label>
<textarea id="messageText" required></textarea>

<button type="submit">إرسال الرسالة</button>

</form>

<div id="message">
تم تجهيز الرسالة للمعالجة. هذه الواجهة حالياً تجريبية.
</div>

<a href="/GeneralWW3Arab/">العودة للرئيسية</a>

</div>
</main>

<script>
document.getElementById("contactForm").addEventListener("submit",function(e){
  e.preventDefault();
  document.getElementById("message").style.display="block";
});
</script>

</body>
</html>
